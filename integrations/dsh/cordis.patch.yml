# ⭐ DBA 双脑架构记忆（2026-10-06 迁移自 hermes/notebook）：
#   memory/core.md 全量注入 | memory/stream.md 记忆流 | memory/ws/*.md 工作区册
#   + 向量层 memory/.vec/（bge-m3，Ollama GPU，与关键词索引零耦合）
# 组装与检索由 **DBA 仓库内** 的 scripts/nb_*.py 负责（不再是 ~/.dsh/scripts）：
#   nb_bridge 产出 _core_context.md + _hits_context.md，snowfox-inject 注入系统提示
# 两个 .mjs 从 DBA_HOME（默认 D:\AI\DBA）解析路径，不硬编码。
- insert:
    # DSH → 记忆流：每 turn 写一行「何时干过什么」到 DBA 的 stream.md，并防抖重建索引
    - id: snowfox-sync
      name: './snowfox-sync.mjs'
    # 组装产物 → 系统提示 section（两段：稳定段 + 每轮变化的检索段）
    - id: snowfox-inject
      name: './snowfox-inject.mjs'

